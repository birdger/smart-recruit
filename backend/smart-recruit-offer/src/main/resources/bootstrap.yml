# =============================================================================
# Nacos 配置中心 — 引导配置（优先于 application.yml 加载）
# =============================================================================
spring:
  application:
    name: smart-recruit-offer
  cloud:
    nacos:
      config:
        namespace: smart-recruit
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yaml
        group: SMART_RECRUIT
        enabled: true
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: smart-recruit
        group: ${COMPUTER_ID:${USER:default}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        ip: 127.0.0.1
  config:
    import:
      - optional:nacos:smart-recruit-offer-dev.yml
